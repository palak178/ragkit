def test_app(streamlit_server, setup_environment):
    # Simulate user interactions and test the expected outputs

    # Test the "Reset Chat" button functionality
    # Simulate a button click and check if the conversation history is reset
    with streamlit_server.empty_persistent_message_ctx():
        st.button("Reset Chat")
        conversation = st.session_state['conversation']
        assert len(conversation) == 0

    # Test uploading a PDF file and processing
    # Simulate a file upload and check if the embeddings are saved to Qdrant
    with streamlit_server.file_uploader_ctx("Choose a PDF file", type=["pdf"]):
        # Simulate uploading a file
        uploaded_file = "path/to/file.pdf"
        st.session_state['uploaded_file'] = uploaded_file
        content = open(uploaded_file, "r").read()

        # Check if embeddings are saved to Qdrant
        embeddings = sentence_transformer_model.encode([content])[0]
        point = PointStruct(id=1, vector=embeddings.tolist())
        operation_info = qdrant_client.upsert(QDRANT_COLLECTION_NAME, True, [point])
        assert operation_info is not None

    # Test user input and bot response
    # Simulate user input and check if the conversation history is updated
    with streamlit_server.chat_input_ctx("What is up?"):
        # Simulate user input
        user_input = "Hello"
        st.session_state['user_input'] = user_input

        # Check if the conversation history is updated correctly
        conversation = st.session_state['conversation']
        assert len(conversation) == 2
        assert conversation[-2]['role'] == 'user'
        assert conversation[-2]['content'] == user_input
        assert conversation[-1]['role'] == 'assistant'

    # Test conversation history display
    # Check if the conversation history is correctly displayed
    with streamlit_server.empty_persistent_message_ctx():
        conversation = [
            {"role": "user", "content": "Hello"},
            {"role": "assistant", "content": "Hi, how can I assist you?"}
        ]
        st.session_state['conversation'] = conversation

        # Check if the conversation history is displayed correctly
        for message in conversation:
            role = message["role"]
            content = message["content"]
            with streamlit_server.chat_message_ctx(role):
                st.markdown(content)
                assert streamlit_server.results[-1].content == content

